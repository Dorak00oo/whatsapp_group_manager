name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts lee DATABASE_URL; generate no se conecta, basta un valor ficticio.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        id: prisma
        run: npx prisma generate

      - name: Tests
        run: npm test

      # Lint y tipos corren aunque falle un paso anterior, para ver todos los errores en una sola ejecución.
      - name: Lint
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm run lint

      - name: Tipos
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: |
          npx next typegen
          npx tsc --noEmit
